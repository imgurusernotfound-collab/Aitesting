<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vanya — AI Companion with Lip Sync Engine</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
}

:root {
    --bg: #07080d;
    --border: rgba(255,255,255,.09);
    --text: #f5f7ff;
    --muted: #969bad;

    /* Floating chat colors */
    --user: #dff3ff;
    --user-text: #18384a;

    --vanya: #ffe5f0;
    --vanya-text: #4d2638;
}

body {
    min-height: 100vh;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background:
        radial-gradient(circle at 15% 15%, rgba(133,111,255,.16), transparent 28%),
        radial-gradient(circle at 85% 80%, rgba(87,146,255,.11), transparent 30%),
        var(--bg);
    overflow: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: -30%;
    background: radial-gradient(circle, rgba(155,140,255,.045) 0 1px, transparent 1px);
    background-size: 32px 32px;
    animation: drift 30s linear infinite;
    pointer-events: none;
}

@keyframes drift {
    to { transform: translate3d(32px, 32px, 0); }
}

.app {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
}

/* Header */
.header {
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    border-bottom: 1px solid var(--border);
    background: rgba(8,9,15,.76);
    backdrop-filter: blur(22px);
    position: relative;
    z-index: 10;
    flex-shrink: 0;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.avatar-icon {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    font-size: 20px;
    background: linear-gradient(145deg, #a99cff, #7163dc);
    box-shadow: 0 8px 30px rgba(128,108,255,.25);
}

.brand-text h1 {
    font-size: 17px;
    letter-spacing: .2px;
}

.brand-text span {
    display: block;
    color: var(--muted);
    font-size: 11px;
    margin-top: 1px;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}

.icon-btn {
    border: 1px solid var(--border);
    background: rgba(255,255,255,.045);
    color: #e9eaff;
    min-width: 40px;
    height: 40px;
    padding: 0 12px;
    border-radius: 12px;
    cursor: pointer;
    transition: .2s ease;
    font-size: 14px;
}

.icon-btn:hover {
    background: rgba(155,140,255,.13);
    border-color: rgba(155,140,255,.3);
}

.voice-btn.active {
    border-color: rgba(155,140,255,.45);
    background: rgba(155,140,255,.15);
    color: #dcd7ff;
}

/* Main Layout */
.main-container {
    flex: 1;
    display: flex;
    flex-direction: row;
    min-height: 0;
    width: 100%;
    height: calc(100vh - 64px);
    position: relative;
    z-index: 2;
}

/* Left Side Avatar Container */
.left-avatar-side {
    flex: 0 0 42%;
    max-width: 480px;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    background: transparent;
    position: relative;
}

.canvas-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

canvas {
    width: 100%;
    height: 100%;
    max-width: 460px;
    max-height: 520px;
    object-fit: contain;
    background: transparent;
    cursor: grab;
    touch-action: none;
}

canvas:active {
    cursor: grabbing;
}

/* =========================================================
   FLOATING CHAT INSIDE AVATAR AREA
   FACE-SAFE SIDE LANE
   ========================================================= */

.floating-chat {
    position: absolute;

    /*
       IMPORTANT:
       Face approx center mein hai.
       Chat ko deliberately right-side lane mein rakha gaya hai.
    */
    top: 8%;
    left: 69%;
    right: 0;

    width: 31%;
    height: 78%;

    display: flex;
    flex-direction: column;

    pointer-events: none;
    z-index: 4;

    /*
       Bubble lane ko thoda breathing room.
    */
    padding-left: 4px;
}

/* Messages viewport */
.messages {
    flex: 1;
    min-height: 0;

    display: flex;
    flex-direction: column;

    overflow-y: auto;
    overflow-x: hidden;

    padding: 10px 3px 8px 4px;

    scroll-behavior: smooth;

    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,.16) transparent;
}

.messages::-webkit-scrollbar {
    width: 3px;
}

.messages::-webkit-scrollbar-track {
    background: transparent;
}

.messages::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,.16);
    border-radius: 99px;
}

/* Message row */
.message {
    display: flex;
    gap: 5px;
    margin-bottom: 7px;
    width: 100%;

    flex-shrink: 0;

    animation: messageIn .22s ease-out;

    pointer-events: auto;
}

@keyframes messageIn {
    from {
        opacity: 0;
        transform: translateY(8px) scale(.98);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.message.user {
    justify-content: flex-end;
}

/* Tiny Vanya icon */
.message-avatar {
    width: 19px;
    height: 19px;
    min-width: 19px;

    border-radius: 6px;

    display: grid;
    place-items: center;

    font-size: 9px;

    background: rgba(255,255,255,.62);
    color: #9b5d78;

    margin-top: 2px;

    box-shadow:
        0 3px 9px rgba(0,0,0,.12);
}

.message.user .message-avatar {
    display: none;
}

.bubble-wrap {
    max-width: 100%;
    min-width: 0;
}

.bubble {
    padding: 7px 9px;

    border-radius: 13px;

    line-height: 1.34;
    font-size: 11px;

    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;

    box-shadow:
        0 5px 16px rgba(0,0,0,.13);

    backdrop-filter: blur(10px);

    /*
       Bubble kabhi lane ke bahar nahi niklega.
    */
    max-width: 100%;
}

/* Vanya = light pink */
.message.vanya .bubble {
    background: rgba(255,229,240,.95);
    color: var(--vanya-text);

    border: 1px solid rgba(255,255,255,.72);

    border-top-left-radius: 4px;
}

/* User = light blue */
.message.user .bubble {
    background: rgba(223,243,255,.95);
    color: var(--user-text);

    border: 1px solid rgba(255,255,255,.72);

    border-top-right-radius: 4px;
}

/* Copy */
.actions {
    display: flex;
    gap: 3px;
    margin-top: 2px;
    opacity: .6;
}

.message.user .actions {
    justify-content: flex-end;
}

.action-btn {
    border: 0;
    background: transparent;

    color: rgba(255,255,255,.72);

    font-size: 8px;
    cursor: pointer;
    padding: 1px 2px;
}

/* Typing indicator */
.typing {
    display: none;
    align-items: center;
    gap: 4px;

    margin: 0 3px 5px;

    color: rgba(255,255,255,.7);

    font-size: 8px;

    pointer-events: none;
    flex-shrink: 0;
}

.typing.show {
    display: flex;
}

.typing-avatar {
    width: 18px;
    height: 18px;

    border-radius: 6px;

    display: grid;
    place-items: center;

    background: rgba(255,229,240,.78);
    color: #9b5d78;

    font-size: 8px;
}

.dots {
    display: flex;
    gap: 2px;
}

.dots i {
    width: 3px;
    height: 3px;
    border-radius: 50%;

    background: rgba(255,255,255,.7);

    animation: dot 1.2s infinite;
}

.dots i:nth-child(2) {
    animation-delay: .15s;
}

.dots i:nth-child(3) {
    animation-delay: .3s;
}

@keyframes dot {
    0%,60%,100% {
        transform: translateY(0);
        opacity: .4;
    }

    30% {
        transform: translateY(-3px);
        opacity: 1;
    }
}

/* =========================================================
   RIGHT SIDE — DESKTOP INPUT AREA
   ========================================================= */

.right-chat-side {
    flex: 1;
    height: 100%;

    display: flex;
    flex-direction: column;

    min-height: 0;

    background: transparent;
}

.chat-shell {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;

    min-height: 0;
}

/* Push composer to bottom */
.composer-area {
    margin-top: auto;

    padding: 10px 24px 14px;

    background: transparent;

    flex-shrink: 0;
}

.composer {
    width: 100%;

    display: flex;
    align-items: flex-end;

    gap: 8px;

    padding: 6px 12px;

    border: 1px solid var(--border);
    border-radius: 18px;

    background: rgba(18, 20, 30, 0.75);

    backdrop-filter: blur(18px);
}

textarea {
    flex: 1;

    resize: none;

    border: 0;
    outline: 0;

    background: transparent;

    color: var(--text);

    font: inherit;
    font-size: 14px;
    line-height: 1.4;

    max-height: 100px;

    padding: 6px 4px;

    user-select: text;
}

textarea::placeholder {
    color: #707488;
}

.send-btn {
    width: 38px;
    height: 38px;

    border: 0;
    border-radius: 12px;

    cursor: pointer;

    background: linear-gradient(145deg, #a79aff, #7161db);

    color: white;

    font-size: 16px;

    flex-shrink: 0;
}

.send-btn:disabled {
    opacity: .55;
    cursor: not-allowed;
}

.footer {
    text-align: center;

    color: #666a7b;

    font-size: 10.5px;

    padding-top: 6px;
}

/* =========================================================
   RESPONSIVE — TABLET
   ========================================================= */

@media (max-width: 900px) {

    .left-avatar-side {
        flex: 0 0 48%;
    }

    .floating-chat {
        top: 8%;
        left: 70%;
        right: 0;

        width: 30%;
        height: 76%;
    }

    .bubble {
        font-size: 10.5px;
        padding: 7px 8px;
    }

    .composer-area {
        padding: 8px 14px 12px;
    }
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 768px) {

    .header {
        padding: 0 12px;
    }

    .left-avatar-side {
        flex: 0 0 100%;
        max-width: none;
        padding: 4px;
    }

    /*
       Mobile canvas full width hai.
       Chat ko face se aur right side shift kiya gaya hai.
    */
    .floating-chat {
        top: 5%;
        left: 67%;
        right: 0;

        width: 33%;
        height: 68%;

        padding-left: 3px;
    }

    .messages {
        padding: 7px 2px 7px 3px;
    }

    .message {
        margin-bottom: 6px;
    }

    .bubble {
        font-size: 10px;
        padding: 6px 8px;
        border-radius: 11px;
        line-height: 1.3;
    }

    .message-avatar {
        width: 17px;
        height: 17px;
        min-width: 17px;
        border-radius: 5px;
        font-size: 8px;
    }

    /*
       Composer mobile par bottom mein rahega.
    */
    .right-chat-side {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: auto;
        z-index: 6;
        pointer-events: none;
    }

    .composer-area {
        padding: 6px 10px 8px;
        pointer-events: auto;
    }

    .composer {
        background: rgba(12,14,22,.88);
    }

    .footer {
        font-size: 9px;
    }
}

/* =========================================================
   VERY SMALL PHONES
   ========================================================= */

@media (max-width: 420px) {

    .floating-chat {
        left: 69%;
        width: 31%;
        height: 65%;
        top: 5%;
    }

    .bubble {
        font-size: 9px;
        padding: 5px 6px;
    }

    .message {
        gap: 3px;
        margin-bottom: 5px;
    }

    .message-avatar {
        width: 15px;
        height: 15px;
        min-width: 15px;
        font-size: 7px;
    }

    .actions {
        display: flex;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="brand">
            <div class="avatar-icon">✦</div>

            <div class="brand-text">
                <h1>Vanya</h1>
                <span>AI Companion</span>
            </div>
        </div>

        <div class="header-actions">

            <button
                class="icon-btn voice-btn"
                id="voiceToggle"
                title="Toggle voice"
            >
                🔇
            </button>

            <button
                class="icon-btn"
                id="clearBtn"
                title="Clear conversation"
            >
                ⌫
            </button>

        </div>

    </header>


    <div class="main-container">

        <!-- =====================================================
             AVATAR + FLOATING CHAT
             ===================================================== -->

        <div class="left-avatar-side">

            <div class="canvas-container">

                <canvas
                    id="avatarCanvas"
                    width="460"
                    height="520"
                ></canvas>


                <!-- =================================================
                     CHAT BUBBLES FLOAT DIRECTLY INSIDE AVATAR AREA
                     ================================================= -->

                <div class="floating-chat">

                    <div
                        class="messages"
                        id="messages"
                    ></div>


                    <div
                        class="typing"
                        id="typing"
                    >

                        <div class="typing-avatar">
                            ✦
                        </div>

                        <span>Vanya is thinking</span>

                        <div class="dots">
                            <i></i>
                            <i></i>
                            <i></i>
                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- =====================================================
             RIGHT SIDE — INPUT ONLY
             ===================================================== -->

        <div class="right-chat-side">

            <section class="chat-shell">

                <div class="composer-area">

                    <div class="composer">

                        <textarea
                            id="input"
                            rows="1"
                            placeholder="send message here!"
                            autocomplete="off"
                        ></textarea>

                        <button
                            class="send-btn"
                            id="sendBtn"
                        >
                            ➤
                        </button>

                    </div>

                    <div class="footer">
                        Created & designed by Shashank Kumar Sahu · Developer • Ed-Tech Enthusiast
                    </div>

                </div>

            </section>

        </div>

    </div>

</div>


<script>

/* =========================================================================
   1. LIP-SYNC ENGINE
   ========================================================================= */

class LipSyncManager {

    constructor() {

        this.MOUTH_SHAPES = {

            SMILE: {
                width: 16,
                height: 6,
                curve: 4,
                open: false
            },

            A: {
                width: 14,
                height: 16,
                curve: 1,
                open: true
            },

            E: {
                width: 18,
                height: 10,
                curve: 2,
                open: true
            },

            I: {
                width: 20,
                height: 7,
                curve: 5,
                open: true
            },

            O: {
                width: 10,
                height: 15,
                curve: 0,
                open: true
            },

            U: {
                width: 7,
                height: 8,
                curve: 0,
                open: true
            },

            MBP: {
                width: 15,
                height: 0,
                curve: 1,
                open: false
            }
        };


        this.currentShape = "SMILE";

        this.isAutoTalking = false;

        this.mouthWidth = 16;
        this.mouthHeight = 6;
        this.mouthCurve = 4;

        this.isMouthOpen = false;

        this.lastTalkSwitch = 0;

        this.talkShapes = [
            "A",
            "E",
            "I",
            "O",
            "U",
            "MBP",
            "SMILE"
        ];
    }


    setShape(shapeKey) {

        if (this.MOUTH_SHAPES[shapeKey]) {

            this.isAutoTalking = false;

            this.currentShape = shapeKey;
        }
    }


    setAutoTalk(enable = true) {

        this.isAutoTalking = enable;

        if (!enable) {

            this.currentShape = "SMILE";
        }
    }


    update() {

        if (this.isAutoTalking) {

            const now = Date.now();

            if (
                now - this.lastTalkSwitch >
                120 + Math.random() * 150
            ) {

                this.currentShape =
                    this.talkShapes[
                        Math.floor(
                            Math.random() *
                            this.talkShapes.length
                        )
                    ];

                this.lastTalkSwitch = now;
            }
        }


        const target =
            this.MOUTH_SHAPES[this.currentShape] ||
            this.MOUTH_SHAPES.SMILE;


        this.mouthWidth +=
            (target.width - this.mouthWidth) * 0.2;

        this.mouthHeight +=
            (target.height - this.mouthHeight) * 0.2;

        this.mouthCurve +=
            (target.curve - this.mouthCurve) * 0.2;

        this.isMouthOpen = target.open;
    }


    draw(ctx, x, y) {

        const mW = this.mouthWidth;
        const mH = this.mouthHeight;
        const mC = this.mouthCurve;

        ctx.save();


        if (mH < 1) {

            ctx.strokeStyle = "#be123c";
            ctx.lineWidth = 3;
            ctx.lineCap = "round";

            ctx.beginPath();

            ctx.moveTo(
                x - mW,
                y
            );

            ctx.quadraticCurveTo(
                x,
                y + mC,
                x + mW,
                y
            );

            ctx.stroke();

        } else {

            ctx.fillStyle = "#be123c";

            ctx.beginPath();

            ctx.moveTo(
                x - mW,
                y
            );

            ctx.quadraticCurveTo(
                x,
                y - mC,
                x + mW,
                y
            );

            ctx.quadraticCurveTo(
                x,
                y + mH * 2,
                x - mW,
                y
            );

            ctx.closePath();

            ctx.fill();


            if (
                this.isMouthOpen &&
                mH > 5
            ) {

                ctx.fillStyle = "#ffffff";

                ctx.beginPath();

                ctx.rect(
                    x - mW * 0.6,
                    y - 1,
                    mW * 1.2,
                    Math.min(mH * 0.5, 5)
                );

                ctx.fill();
            }


            ctx.strokeStyle = "#9f1239";
            ctx.lineWidth = 2;

            ctx.beginPath();

            ctx.moveTo(
                x - mW,
                y
            );

            ctx.quadraticCurveTo(
                x,
                y - mC,
                x + mW,
                y
            );

            ctx.quadraticCurveTo(
                x,
                y + mH * 2,
                x - mW,
                y
            );

            ctx.stroke();
        }


        ctx.restore();
    }
}


let setExpression = null;
let setAutoTalk = null;


/* =========================================================================
   2. AVATAR CANVAS RENDERER PIPELINE
   ========================================================================= */

(() => {

    const canvas =
        document.getElementById("avatarCanvas");

    const ctx =
        canvas.getContext("2d");


    const lipSync =
        new LipSyncManager();


    setExpression =
        (shapeKey) =>
            lipSync.setShape(shapeKey);


    setAutoTalk =
        (enable) =>
            lipSync.setAutoTalk(enable);


    const STATE = {

        isDragging: false,

        startX: 0,
        startY: 0,

        targetX: 0,
        targetY: 0,

        lookX: 0,
        lookY: 0,

        blinkProgress: 0,
        blinkState: "idle",

        smileAmount: 0.3,
        targetSmile: 0.3,

        hairTime: 0
    };


    const CANVAS_WIDTH =
        canvas.width;

    const CANVAS_HEIGHT =
        canvas.height;

    const BASE_CENTER_X =
        CANVAS_WIDTH / 2;

    const BASE_CENTER_Y =
        225;


    function getPointerPosition(e) {

        return e.touches
            ? e.touches[0]
            : e;
    }


    function onPointerDown(e) {

        STATE.isDragging = true;

        const p =
            getPointerPosition(e);

        STATE.startX = p.clientX;
        STATE.startY = p.clientY;
    }


    function onPointerMove(e) {

        if (!STATE.isDragging)
            return;

        const p =
            getPointerPosition(e);

        const dx =
            p.clientX - STATE.startX;

        const dy =
            p.clientY - STATE.startY;


        STATE.targetX =
            Math.max(
                -1.1,
                Math.min(
                    1.1,
                    STATE.targetX + dx * 0.005
                )
            );


        STATE.targetY =
            Math.max(
                -0.8,
                Math.min(
                    0.8,
                    STATE.targetY + dy * 0.005
                )
            );


        STATE.startX = p.clientX;
        STATE.startY = p.clientY;

        STATE.targetSmile = 0.8;
    }


    function onPointerUp() {

        STATE.isDragging = false;

        STATE.targetSmile = 0.3;
    }


    canvas.addEventListener(
        "mousedown",
        onPointerDown
    );

    window.addEventListener(
        "mousemove",
        onPointerMove
    );

    window.addEventListener(
        "mouseup",
        onPointerUp
    );


    canvas.addEventListener(
        "touchstart",
        onPointerDown,
        { passive: true }
    );

    window.addEventListener(
        "touchmove",
        onPointerMove,
        { passive: true }
    );

    window.addEventListener(
        "touchend",
        onPointerUp
    );


    let nextBlinkTime =
        Date.now() + 1000;

    let holdEndTime = 0;


    function updateBlink() {

        const now =
            Date.now();


        if (
            STATE.blinkState ===
            "idle"
        ) {

            if (
                now >= nextBlinkTime
            ) {

                STATE.blinkState =
                    "closing";
            }

        } else if (
            STATE.blinkState ===
            "closing"
        ) {

            STATE.blinkProgress +=
                0.18;


            if (
                STATE.blinkProgress >= 1
            ) {

                STATE.blinkProgress = 1;

                STATE.blinkState =
                    "holding";

                holdEndTime =
                    now + 45;
            }

        } else if (
            STATE.blinkState ===
            "holding"
        ) {

            if (
                now >= holdEndTime
            ) {

                STATE.blinkState =
                    "opening";
            }

        } else if (
            STATE.blinkState ===
            "opening"
        ) {

            STATE.blinkProgress -=
                0.18;


            if (
                STATE.blinkProgress <= 0
            ) {

                STATE.blinkProgress = 0;

                STATE.blinkState =
                    "idle";

                nextBlinkTime =
                    now +
                    Math.random() * 2500 +
                    1800;
            }
        }
    }


    function render() {

        ctx.clearRect(
            0,
            0,
            CANVAS_WIDTH,
            CANVAS_HEIGHT
        );

function localHinglishFix(text) {

    if (!text)
        return "";


    let cleaned =
        text

            .replace(
                /```[\s\S]*?```/g,
                ""
            )

            .replace(
                /[*_#>`]/g,
                ""
            )

            .replace(
                /[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2700}-\u{27BF}\u{1F900}-\u{1F9FF}\u{1F018}-\u{1F093}\u{2B50}\u{2B55}\u{231A}\u{231B}\u{23E9}-\u{23EC}\u{23F0}\u{23F3}]/gu,
                ''
            )

            .replace(
                /[~`@#\$%\^*_+=\\\|\[\]\{\}<>\/]/g,
                ' '
            );


    const wordMap = {

        "bhi": "भी",
        "hai": "है",
        "hain": "हैं",
        "kaise": "कैसे",
        "ho": "हो",
        "dosto": "दोस्तों",
        "suno": "सुनो",
        "ye": "ये",
        "yeh": "यह",
        "na": "ना",
        "nhi": "नहीं",
        "nahi": "नहीं",
        "ko": "को",
        "kuch": "कुछ",
        "karo": "करो",
        "chalega": "चलेगा",
        "chalegaa": "चलेगा",
        "bina": "बिना",
        "kisi": "किसी",
        "par": "पर",
        "aur": "और",
        "ab": "अब",
        "iss": "इस",
        "isme": "इसमें",
        "vagehrah": "वगैरह",
        "vagerah": "वगैरह",
        "kya": "क्या",
        "baat": "बात",
        "samajh": "समझ",
        "aaj": "आज",
        "main": "मैं",
        "mujhe": "मुझे",
        "aap": "आप",
        "tum": "तुम",
        "kahan": "कहां",
        "kab": "कब",
        "kyun": "क्यों",
        "bohot": "बहुत",
        "bahut": "बहुत",
        "achha": "अच्छा",
        "accha": "अच्छा",
        "sahi": "सही"
    };


    return cleaned

        .split(/\s+/)

        .map(word => {

            let cleanWord =
                word
                    .replace(
                        /[.,!?]/g,
                        ""
                    )
                    .toLowerCase();


            let punc =
                word.match(
                    /[.,!?]/g
                )
                    ? word
                        .match(
                            /[.,!?]/g
                        )
                        .join("")
                    : "";


            return wordMap[cleanWord]
                ? (
                    wordMap[cleanWord] +
                    punc
                )
                : word;
        })

        .join(' ')

        .replace(
            /\s+/g,
            ' '
        )

        .trim();
}


function chooseVoice() {

    if (
        !("speechSynthesis" in window)
    )
        return null;


    const voices =
        availableVoices.length
            ? availableVoices
            : speechSynthesis.getVoices();


    return (

        voices.find(
            v =>
                v.lang === "hi-IN" ||
                v.lang === "hi_IN"
        )

        ||

        voices.find(
            v =>
                v.lang.includes("hi")
        )

        ||

        voices.find(
            v =>
                /^en-IN/i.test(v.lang)
        )

        ||

        voices.find(
            v =>
                /^en-US/i.test(v.lang)
        )

        ||

        voices[0]
    );
}


/* --- CONTINUOUS LIP-SYNC & VOLUME-CONTROLLED SPEECH ENGINE --- */

function speakText(text) {

    if (
        !("speechSynthesis" in window)
    )
        return;


    stopSpeaking();


    const processedText =
        localHinglishFix(text);


    if (!processedText)
        return;


    const utterance =
        new SpeechSynthesisUtterance(
            processedText
        );


    const voice =
        chooseVoice();


    if (voice) {

        utterance.voice =
            voice;

        utterance.lang =
            voice.lang;

    } else {

        utterance.lang =
            "hi-IN";
    }


    utterance.rate =
        0.85;


    utterance.pitch =
        1.0;


    utterance.volume =
        voiceEnabled
            ? 1.0
            : 0.0;


    currentSpeech =
        utterance;


    utterance.onstart =
        () => {

            if (setAutoTalk)
                setAutoTalk(true);
        };


    utterance.onend =
        () => {

            currentSpeech =
                null;

            if (setAutoTalk)
                setAutoTalk(false);
        };


    utterance.onerror =
        () => {

            currentSpeech =
                null;

            if (setAutoTalk)
                setAutoTalk(false);
        };


    speechSynthesis.speak(
        utterance
    );
}

async function askVanya(userText) {

    conversation.push({
        role: "user",
        content: userText
    });

    const response =
        await fetch(
            "https://aivanyaproject.clouduser2.workers.dev",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({

                        model:
                            VANYA_MODEL,

                        messages: [

                            {
                                role: "system",
                                content:
                                    VANYA_SYSTEM
                            },

                            ...conversation
                        ],

                        temperature:
                            0.8,

                        max_completion_tokens:
                            4096
                    })
            }
        );

    if (!response.ok) {

        let errorText =
            "API request failed.";

        try {

            const errorData =
                await response.json();

            errorText =
                errorData
                    ?.error
                    ?.message ||
                errorText;

        } catch {}

        throw new Error(
            errorText
        );
    }

    const data =
        await response.json();

    const reply =
        data
            ?.choices?.[0]
            ?.message
            ?.content
            ?.trim();

    if (!reply) {

        throw new Error(
            "Vanya returned an empty response."
        );
    }

    conversation.push({
        role: "assistant",
        content: reply
    });

    return reply;
}
